name: Rescue password converter

on:
  push:
    branches: [main]
    paths:
      - 'docs/rescue-converter/**'
      - 'docs/translation-tool/**'
      - 'tools/**'
      - 'script/drafts/**'
      - 'script/editing/**'
      - 'tests/test_workbench_web.py'
      - 'tests/workbench_web*'
      - 'tests/control_reference.test.mjs'
      - 'tests/fixtures/workbench_web_cases.json'
      - 'script/en/**'
      - 'assets/fonts/thin_pixel_7*'
      - 'data/kanji.tsv'
      - 'tests/test_prose_web.py'
      - 'tests/prose_web.test.mjs'
      - 'tests/fixtures/prose_web_cases.json'
      - 'tests/fixtures/prose_web_allocation.json'
      - 'data/special_rescue_missions.json'
      - 'tests/test_rescue_converter.py'
      - 'tests/rescue_converter.test.cjs'
      - '.github/workflows/rescue-converter-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check-and-upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Check converter, workbench rules and generated assets
        run: |
          node --version
          python3 -m unittest tests.test_rescue_converter -v
          python3 tools/prose_web.py check-assets
          python3 tools/workbench_web.py check-assets
          python3 -m unittest tests.test_prose_web -v
          python3 -m unittest tests.test_workbench_web -v
          node tests/prose_web.test.mjs
          node tests/workbench_web.test.mjs
          node tests/control_reference.test.mjs
      - name: Stage public pages
        run: python3 tools/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    needs: check-and-upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy rescue page and translation tools
        id: deployment
        uses: actions/deploy-pages@v4
