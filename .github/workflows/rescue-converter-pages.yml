name: Rescue password converter

on:
  push:
    branches: [main]
    paths:
      - 'docs/rescue-converter/**'
      - 'data/special_rescue_missions.json'
      - 'tools/rescue_converter.py'
      - 'tools/rescue_password.py'
      - 'tools/codec.py'
      - 'tools/english.py'
      - 'tools/extract.py'
      - 'tests/test_rescue_converter.py'
      - 'tests/rescue_converter.test.cjs'
      - '.github/workflows/rescue-converter-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check-and-upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Check converter and generated alphabet
        run: |
          node --version
          python3 -m unittest tests.test_rescue_converter -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/rescue-converter

  deploy:
    needs: check-and-upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy converter
        id: deployment
        uses: actions/deploy-pages@v4
